name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          include-hidden-files: true # keep .htaccess

  deploy:
    # The built site goes to the root of `main` (index.html, assets/, favicon.svg, .htaccess),
    # which the hosting's Git app (hostcreators) serves as is, and to the `deploy` branch.
    # A push made with GITHUB_TOKEN does not start this workflow again.
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - name: Put the built site at the repository root
        run: |
          # Every top-level file or folder of the build (index.html, assets/, icons, samples/, .htaccess …)
          files=$(ls -A dist)
          rm -rf $files
          cp -r dist/. .
          rm -rf dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- $files
          if git diff --cached --quiet; then echo "Site unchanged"; else git commit -m "Build site [skip ci]" && git push; fi
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: deploy
          publish_dir: ./dist
          force_orphan: true
          enable_jekyll: true
          commit_message: 'Deploy'
